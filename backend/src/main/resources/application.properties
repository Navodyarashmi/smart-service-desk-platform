spring.application.name=smart-service-desk-api

# Load local development variables from the ignored root .env file.
# In cloud environments, operating-system environment variables override these values.
spring.config.import=optional:file:../.env[.properties]

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:smart_service_desk}
spring.datasource.username=${POSTGRES_USER:smartdesk_app}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway database migrations
spring.flyway.enabled=true

# Health probes for Docker and cloud deployment
management.endpoint.health.probes.enabled=true